name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-macos:
    name: Build macOS Release Artifacts
    runs-on: macos-latest
    env:
      REQUIRE_MACOS_SIGNING: ${{ vars.REQUIRE_MACOS_SIGNING }}
      REQUIRE_MACOS_NOTARIZATION: ${{ vars.REQUIRE_MACOS_NOTARIZATION }}
      REQUIRE_TAURI_UPDATER: ${{ vars.REQUIRE_TAURI_UPDATER }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup pinned npm
        run: npm install --global npm@12.2.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # rust 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Validate macOS signing/notarization preflight
        run: npm run release:macos:preflight

      - name: Run canonical Tauri verification
        run: DESKTOP_PET_STRICT_RUST=1 npm run verify:required:tauri

      - name: Validate release artifacts
        run: npm run release:artifacts:validate

      - name: Package updater assets
        run: npm run release:updater:package

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-pet-macos
          path: |
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/dmg/*.dmg
            artifacts/release/tauri-artifacts.txt
            artifacts/release/tauri-artifacts-sha256.txt
            artifacts/release/updater-artifacts.txt
            artifacts/release/updater-assets.tar.gz
          if-no-files-found: ignore

      - name: Publish GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            artifacts/release/tauri-artifacts-sha256.txt
          generate_release_notes: true

      - name: Publish updater release assets (tag builds only)
        if: startsWith(github.ref, 'refs/tags/') && hashFiles('artifacts/release/updater-assets.tar.gz') != ''
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            artifacts/release/updater-artifacts.txt
            artifacts/release/updater-assets.tar.gz
