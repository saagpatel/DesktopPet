name: security

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

jobs:
  security-scans:
    name: Dependency + Secret Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DESKTOP_PET_STRICT_SECURITY: "1"
      DESKTOP_PET_SKIP_GITLEAKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Setup pinned npm
        run: npm install --global npm@12.2.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # rust 1.98.1
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run strict dependency security scans
        run: npm run security:scan

      - name: Skip strict secret scan
        if: env.DESKTOP_PET_SKIP_GITLEAKS == '1'
        run: echo "Skipping gitleaks action because DESKTOP_PET_SKIP_GITLEAKS=1."

      - name: Run strict secret scan
        if: env.DESKTOP_PET_SKIP_GITLEAKS != '1'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: security-scan-artifacts
          path: artifacts/security/*
          if-no-files-found: ignore
