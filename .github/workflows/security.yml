name: security

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  security-scans:
    name: Dependency + Secret Security Scans
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DESKTOP_PET_STRICT_SECURITY: "1"
      DESKTOP_PET_SKIP_GITLEAKS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (2026-10-05)

      - name: Install dependencies
        run: npm ci

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run strict dependency security scans
        run: npm run security:scan

      - name: Skip strict secret scan
        if: env.DESKTOP_PET_SKIP_GITLEAKS == '1'
        run: echo "Skipping gitleaks action because DESKTOP_PET_SKIP_GITLEAKS=1."

      - name: Run strict secret scan
        if: env.DESKTOP_PET_SKIP_GITLEAKS != '1'
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-scan-artifacts
          path: artifacts/security/*
          if-no-files-found: ignore
